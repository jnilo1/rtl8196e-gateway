name: Build cpcd-zigbeed Docker image

# Publish ONLY when a release tag vX.Y.Z is pushed (or via manual dispatch).
# Pushes to main do NOT build/publish: main is a pre-release staging line and
# must not clobber the public ghcr :latest before a release is cut. A release
# tag builds only if the image inputs changed since the previous release tag
# (job `changes`), so a release that leaves the image alone publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cpcd-zigbeed

jobs:
  changes:
    name: Decide whether the image changed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - name: Checkout repository with its tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the image inputs with the previous release tag
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          INPUTS: >-
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/.dockerignore
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/docker/cpcd-zigbeed
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/cpcd/tcp-bus.patch
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/zigbeed/serial_adapter_posix.c
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/zigbeed/serial_adapter_posix.h
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/zigbeed/install_serial_adapter.sh
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/zigbeed/THIRD_PARTY_NOTICES
        run: |
          # A release tag rebuilds the image only when one of its inputs changed
          # since the previous release tag. Rebuilding unchanged sources is not a
          # no-op: the base image and apt packages are not pinned, so it would
          # publish a different, untested image and move :latest onto it.
          # Manual dispatches and pull requests always build. INPUTS lists what
          # the Dockerfile copies from its context; this workflow file is not in
          # it, so a change to the build settings here needs a manual dispatch.
          if [ "$EVENT" != push ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous release tag: building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # INPUTS is a space-separated list of repository paths.
          # shellcheck disable=SC2086
          if git diff --quiet "$prev" "$GITHUB_SHA" -- $INPUTS; then
            echo "Image inputs unchanged since $prev: nothing to build or publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Image inputs changed since $prev:"
            # shellcheck disable=SC2086
            git diff --stat "$prev" "$GITHUB_SHA" -- $INPUTS
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    runs-on: ubuntu-latest
    # The ghcr package jnilo1/cpcd-zigbeed is owned by the PUBLIC repo, so the
    # image must be built and pushed from there — the private repo's
    # GITHUB_TOKEN has no write_package on it. The release tag is pushed to
    # both remotes; this guard skips the private repo's run so it does not fail
    # on the denied push (and avoids a duplicate build).
    if: github.repository == 'jnilo1/rtl8196e-gateway' && needs.changes.outputs.build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the component tag from the Dockerfile
        id: component
        run: |
          # cpcd<ver>-ezsp<N> names a component combination that users pin, so
          # its cpcd field is read from the Dockerfile rather than written here:
          # a cpcd bump publishes a new tag and leaves the previous one on its
          # last build. The ezsp18 suffix is EZSP 18 from the Simplicity SDK
          # 2025.6 line zigbeed is built on; change it with that line.
          ver=$(sed -nE 's/^ARG CPCD_VERSION=v?([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' \
            2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/docker/cpcd-zigbeed/Dockerfile.multiarch)
          if [ -z "$ver" ]; then
            echo "ARG CPCD_VERSION=vX.Y.Z not found in the cpcd-zigbeed Dockerfile" >&2
            exit 1
          fi
          echo "tag=cpcd${ver}-ezsp18" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Pre-release tags (e.g. v3.8.0-rc1) publish only the versioned image
          # and the sha tag; they must not move :latest or the component tag,
          # which keep pointing at the last GA release.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}
            type=raw,value=${{ steps.component.outputs.tag }},enable=${{ !contains(github.ref_name, '-rc') }}
            type=sha,prefix=

      # silabs.com answers 403 to command-line clients, GitHub runners included,
      # so the slc-cli archive the image needs at build time is fetched from a
      # release asset the maintainer keeps privately. The repo and the release
      # tag are repository variables, the read-only token a secret; none of them
      # appears in the tree. The archive reaches the Dockerfile as the slc_cli
      # named build context, mounted read-only for the one RUN that uses it, so
      # no layer and no cache entry keeps it, and RUNNER_TEMP is discarded with
      # the runner. Without these settings the folder stays empty and the
      # Dockerfile falls back to the silabs.com download, which then fails with
      # a clear message.
      - name: Fetch the slc-cli archive
        env:
          GH_TOKEN: ${{ secrets.SILABS_ASSETS_TOKEN }}
          ASSETS_REPO: ${{ vars.SILABS_ASSETS_REPO }}
          ASSETS_RELEASE: ${{ vars.SILABS_ASSETS_RELEASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/slc_cli"
          if [ -z "$GH_TOKEN" ] || [ -z "$ASSETS_REPO" ] || [ -z "$ASSETS_RELEASE" ]; then
            echo "::warning::SILABS_ASSETS_TOKEN / SILABS_ASSETS_REPO / SILABS_ASSETS_RELEASE not set: trying the silabs.com download."
            exit 0
          fi
          gh release download "$ASSETS_RELEASE" --repo "$ASSETS_REPO" \
            --pattern slc_cli_linux.zip --dir "$RUNNER_TEMP/slc_cli"
          test -s "$RUNNER_TEMP/slc_cli/slc_cli_linux.zip"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW
          file: 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/docker/cpcd-zigbeed/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          build-contexts: slc_cli=${{ runner.temp }}/slc_cli
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
