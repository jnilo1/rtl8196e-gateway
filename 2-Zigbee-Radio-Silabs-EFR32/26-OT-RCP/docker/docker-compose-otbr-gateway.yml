# Use case 3: OTBR on gateway — Thread/Matter with OTBR running on the gateway
#
# Stack: Matter Server + Home Assistant (NO OTBR container)
# The gateway runs otbr-agent natively (v2.0+) — REST API on :8081.
# This stack provides only HA + Matter Server on the host.
#
# See also:
#   docker-compose-zoh.yml          — Use case 1: Zigbee (zigbee-on-host)
#   docker-compose-otbr-host.yml    — Use case 2: OTBR on host
#
# Prerequisites:
#   1. Flash the OT-RCP firmware: ./flash_efr32.sh otrcp   (from the repo root)
#   2. Flash userdata in Thread mode (flash_userdata.sh → select "Thread")
#   3. Verify OTBR is running: curl http://<GATEWAY_IP>:8081/node
#
# Usage:
#   1. docker compose -f docker-compose-otbr-gateway.yml up -d
#   2. Open Home Assistant at http://<HOST_IP>:8123
#   3. Add integrations:
#      - Thread / OTBR:  http://<GATEWAY_IP>:8081   (the gateway, NOT localhost)
#      - Matter:         ws://localhost:5580/ws
#   4. Commission Matter devices via Settings → Devices → Add Device → Matter
#
# ---------------------------------------------------------------------------
# Matter Server: matter.js, not python-matter-server
#
# The Matter server was rewritten on matter.js and moved to a new image
# (ghcr.io/matter-js/matterjs-server) — this is what the current Home Assistant
# "Matter Server" add-on packages. It is a drop-in replacement: same WebSocket API on
# :5580/ws, plus a web dashboard on :5580/. The old ghcr.io/matter-js/python-matter-server
# is frozen at 8.1.2 and no longer updated.
#
# This file mounts a NEW volume (matterjs_data) and leaves the legacy volume (matter_data)
# declared but unmounted, so a rollback is just putting the old image and volume names
# back. Consequence of starting on an empty volume: a fresh Matter fabric — every device
# has to be re-commissioned.
#
# To migrate the existing fabric instead of starting fresh, copy the old volume over
# BEFORE the first start — the storage format is upgraded on first run, one way only:
#
#   docker compose -f docker-compose-otbr-gateway.yml down
#   docker volume ls | grep matter     # volumes carry the compose project name as prefix
#   docker run --rm -v <project>_matter_data:/from -v <project>_matterjs_data:/to alpine \
#       sh -c 'cp -a /from/. /to/ && chown -R 1000:1000 /to'
#
#   Background on the rewrite:
#     https://github.com/home-assistant/addons/blob/master/matter_server/MIGRATION_FAQ.md
#     https://github.com/matter-js/matterjs-server/blob/main/docs/docker.md
# ---------------------------------------------------------------------------

services:
  # Matter Server (matter.js) — Matter fabric controller
  matter-server:
    container_name: matter-server
    # Pinned to a release tag for reproducibility. 1.4.0 == stable == latest as of
    # 2026-09-14, digest:
    #   sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
    # Switch to :stable to follow upstream instead.
    image: ghcr.io/matter-js/matterjs-server:1.4.0
    network_mode: host        # required — mDNS and Matter device discovery
    restart: unless-stopped
    # The image runs unprivileged (uid 1000) and creates /data already owned by 1000:1000,
    # so a fresh NAMED volume inherits the right ownership: no privileged, no apparmor
    # exception, no /sys/fs/cgroup mount, no manual chown. (A bind-mount instead of a named
    # volume WOULD need `chown -R 1000:1000 <dir>` — Docker does not adjust bind-mounts.)
    volumes:
      - matterjs_data:/data
    environment:
      - TZ=Europe/Paris
      # The WebSocket API on :5580 is the Matter fabric's control plane — list, commission,
      # decommission, command — and it takes no credentials; the dashboard on :5580/ drives
      # the same API. With network_mode: host the server would otherwise bind every
      # interface and hand that to the whole LAN. Home Assistant sits in this same file, on
      # the same host, and reaches it over loopback, so restricting costs nothing here.
      # Remove or set to a reachable address if you move HA to another machine, or if you
      # want the dashboard from another one (`ssh -L 5580:127.0.0.1:5580 <host>` also works).
      # Matter/Thread traffic is unaffected: devices are reached over IPv6/mDNS and OTBR,
      # never through this port.
      - LISTEN_ADDRESS=127.0.0.1
    # BLE commissioning from this container is deliberately not enabled: with the HA
    # Companion app the phone's Bluetooth carries the commissioning, so the server needs
    # no radio of its own. To enable it anyway (host BlueZ running, adapter powered), add
    # NOBLE_BINDINGS=dbus + BLUETOOTH_ADAPTER=0 and mount /run/dbus:/run/dbus:ro — see
    # docs/docker.md in the matterjs-server repo.

  # Home Assistant — UI for commissioning and device management
  homeassistant:
    container_name: homeassistant
    # Pinned to a release tag for reproducibility. 2026.9.2 == stable as of
    # 2026-09-14, digest:
    #   sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
    # Switch to :stable to follow upstream instead.
    image: ghcr.io/home-assistant/home-assistant:2026.9.2
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - ha_config:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/Paris

volumes:
  matterjs_data:   # matter.js Matter Server — current
  matter_data:     # legacy python-matter-server — declared but unmounted, kept for rollback
  ha_config:
