# Use case 2: OTBR on host — Thread/Matter with OTBR running on your PC
#
# Stack: OTBR (Docker) + Matter Server + Home Assistant
# The gateway only forwards the UART over TCP via its in-kernel bridge —
# OTBR runs here on the host.
#
# See also:
#   docker-compose-zoh.yml          — Use case 1: Zigbee (zigbee-on-host)
#   docker-compose-otbr-gateway.yml — Use case 3: OTBR on gateway (v2.0+)
#
# Usage:
#   1. Flash the OT-RCP firmware (./flash_efr32.sh otrcp), flash userdata in Zigbee mode
#   2. Ensure the gateway runs kernel 6.18 with rtl8196e-uart-bridge armed at
#      460800 baud (S50uart_bridge default) on TCP:8888
#   3. Edit RCP_HOST and OTBR_BACKBONE_IF below
#   4. docker compose -f docker-compose-otbr-host.yml up -d
#   5. Open Home Assistant at http://localhost:8123
#   6. Add integrations: OTBR (localhost:8081) + Matter (localhost:5580)
#   7. Commission Matter devices via Settings → Devices → Add Device → Matter
#
# Matter Server: matter.js, not python-matter-server
#   The Matter server was rewritten on matter.js and moved to a new image
#   (ghcr.io/matter-js/matterjs-server) — the same code Home Assistant ships as its
#   "Matter Server" add-on. Drop-in replacement: same WebSocket API on :5580/ws, plus a web
#   dashboard on :5580/. The old ghcr.io/matter-js/python-matter-server is frozen at 8.1.2.
#   As in docker-compose-otbr-gateway.yml, this file mounts a NEW volume (matterjs_data)
#   and leaves the legacy one (matter_data) declared but unmounted for rollback — so the
#   fabric starts empty and devices must be re-commissioned. See the migration note at the
#   top of docker-compose-otbr-gateway.yml to carry the existing fabric over instead, and
#   docker/README.md — "Matter Server — matter.js" — for the background links.

services:
  # OpenThread Border Router — connects to OT-RCP via the kernel UART bridge
  otbr:
    container_name: otbr
    image: bnutzer/otbr-tcp
    network_mode: host
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/net/tun
    environment:
      # ============================================================
      # REQUIRED: your gateway's IP address.
      # The gateway must be running the in-kernel UART bridge on port 8888
      # (armed by S50uart_bridge at boot).
      # flash_userdata.sh writes the address it just installed into a .env file
      # next to this one, which Compose reads automatically — so this usually
      # needs no editing. Set RCP_HOST in that .env (or in your environment) to
      # override; the literal below is only the fallback for a gateway that was
      # never installed from this checkout.
      # ============================================================
      - RCP_HOST=${RCP_HOST:-192.168.1.88}
      - RCP_PORT=8888
      - RCP_BAUDRATE=460800
      # ============================================================
      # Thread/OTBR configuration
      - OTBR_LOG_LEVEL_INT=6
      - OTBR_WEB_ENABLE=1
      - OTBR_WEB_PORT=8080
      - OTBR_REST_LISTEN_PORT=8081
      - OTBR_BACKBONE_IF=enp2s0
    volumes:
      - otbr_data:/var/lib/thread

  # Matter Server (matter.js) — Matter fabric controller
  matter-server:
    container_name: matter-server
    # Pinned to a release tag for reproducibility. 1.4.0 == stable == latest as of
    # 2026-09-14, digest:
    #   sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
    # Switch to :stable to follow upstream instead.
    image: ghcr.io/matter-js/matterjs-server:1.4.0
    network_mode: host        # required — mDNS and Matter device discovery
    restart: unless-stopped
    # The image runs unprivileged (uid 1000) and creates /data already owned by 1000:1000,
    # so a fresh NAMED volume inherits the right ownership: no privileged, no apparmor
    # exception, no /sys/fs/cgroup mount, no manual chown. (A bind-mount instead of a named
    # volume WOULD need `chown -R 1000:1000 <dir>` — Docker does not adjust bind-mounts.)
    volumes:
      - matterjs_data:/data
    environment:
      - TZ=Europe/Paris
      # The WebSocket API on :5580 is the Matter fabric's control plane — list, commission,
      # decommission, command — and it takes no credentials; the dashboard on :5580/ drives
      # the same API. With network_mode: host the server would otherwise bind every
      # interface and hand that to the whole LAN. Home Assistant sits in this same file, on
      # the same host, and reaches it over loopback, so restricting costs nothing here.
      # Remove or set to a reachable address if you move HA to another machine, or if you
      # want the dashboard from another one (`ssh -L 5580:127.0.0.1:5580 <host>` also works).
      # Matter/Thread traffic is unaffected: devices are reached over IPv6/mDNS and OTBR,
      # never through this port.
      - LISTEN_ADDRESS=127.0.0.1
    # BLE commissioning from this container is deliberately not enabled: with the HA
    # Companion app the phone's Bluetooth carries the commissioning, so the server needs
    # no radio of its own. To enable it anyway (host BlueZ running, adapter powered), add
    # NOBLE_BINDINGS=dbus + BLUETOOTH_ADAPTER=0 and mount /run/dbus:/run/dbus:ro — see
    # docs/docker.md in the matterjs-server repo.

  # Home Assistant — UI for commissioning and device management
  homeassistant:
    container_name: homeassistant
    # Pinned to a release tag for reproducibility. 2026.9.2 == stable as of
    # 2026-09-14, digest:
    #   sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
    # Switch to :stable to follow upstream instead.
    image: ghcr.io/home-assistant/home-assistant:2026.9.2
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - ha_config:/config
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/Paris

volumes:
  otbr_data:
  matterjs_data:   # matter.js Matter Server — current
  matter_data:     # legacy python-matter-server — declared but unmounted, kept for rollback
  ha_config:
