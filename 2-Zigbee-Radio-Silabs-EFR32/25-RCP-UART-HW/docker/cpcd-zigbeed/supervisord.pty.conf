[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# CPCd uses the native TCP bus to reach the RCP and exposes CPC sockets in
# /dev/shm/cpcd/. PTY mode applies only to the Zigbeed-to-Z2M transport.
[program:cpcd]
command=/usr/local/bin/cpcd -c /etc/cpcd/cpcd.conf
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=200

# Compatibility transport: Zigbeed uses one PTY and socat exposes its peer as
# the TCP stream consumed by Zigbee2MQTT.
[program:socat-pty-zigbeed]
command=socat pty,raw,echo=0,link=%(ENV_ZIGBEED_PTY)s pty,raw,echo=0,link=%(ENV_ZIGBEED_PTY_HOST)s
autostart=true
autorestart=unexpected
startsecs=0
startretries=999
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=250

[program:zigbeed]
command=/bin/sh -c 'while [ ! -e "%(ENV_ZIGBEED_PTY)s" ]; do sleep 1; done; exec /usr/local/bin/zigbeed -r "spinel+cpc://%(ENV_CPCD_INSTANCE)s?iid=%(ENV_ZIGBEED_IID)s&iid-list=%(ENV_CPC_BROADCAST_IID)s" -p "%(ENV_ZIGBEED_INTERFACE)s" -d %(ENV_ZIGBEED_DEBUG)s'
directory=/var/lib/zigbeed
autostart=true
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=300

[program:socat-zigbeed]
command=/bin/sh -c 'while [ ! -e "%(ENV_ZIGBEED_PTY_HOST)s" ]; do sleep 1; done; exec socat tcp-listen:%(ENV_ZIGBEED_PORT)s,reuseaddr,fork,max-children=1 file:%(ENV_ZIGBEED_PTY_HOST)s,raw,echo=0,nonblock'
autostart=true
autorestart=unexpected
startsecs=0
startretries=999
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=400

[eventlistener:process_exit]
command=/bin/sh -c 'echo "READY"; while read line; do echo "RESULT 2"; echo "OK"; done'
events=PROCESS_STATE_FATAL
