[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# cpcd: CPC daemon connecting to the RCP over the gateway's UART<->TCP bridge.
# With the native TCP bus (bus_type: TCP in cpcd.conf) cpcd dials
# ${RCP_HOST}:${RCP_PORT} itself and reconnects on link drops — no socat shim,
# no stale-PTY restart cascade. Exposes CPC sockets in /dev/shm/cpcd/.
[program:cpcd]
command=/usr/local/bin/cpcd -c /etc/cpcd/cpcd.conf
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=200

# zigbeed: Zigbee stack daemon (EmberZNet 8.x)
# Connects to cpcd via CPC sockets and exposes the native single-client
# EZSP TCP listener (ZIGBEED_INTERFACE, set by entrypoint.sh).
[program:zigbeed]
command=/usr/local/bin/zigbeed -r spinel+cpc://%(ENV_CPCD_INSTANCE)s?iid=%(ENV_ZIGBEED_IID)s&iid-list=%(ENV_CPC_BROADCAST_IID)s -p %(ENV_ZIGBEED_INTERFACE)s -d %(ENV_ZIGBEED_DEBUG)s
directory=/var/lib/zigbeed
autostart=true
autorestart=true
startsecs=10
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=300

[eventlistener:process_exit]
command=/bin/sh -c 'echo "READY"; while read line; do echo "RESULT 2"; echo "OK"; done'
events=PROCESS_STATE_FATAL
