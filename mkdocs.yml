        - Field-test report: 2-Zigbee-Radio-Silabs-EFR32/26-OT-RCP/range-testing/REPORT.md
    - Standalone Zigbee router: 2-Zigbee-Radio-Silabs-EFR32/27-Router/README.md
    - Radio backup, flash, and restore: 2-Zigbee-Radio-Silabs-EFR32/22-Backup-Flash-Restore/README.md
    - Gecko bootloader:
