site_name: RTL8196E Gateway
site_description: Open-source Linux firmware for RTL8196E-based smart home gateways (Lidl Silvercrest, Sengled G4) — Zigbee coordinator, Thread Border Router, or router.
site_url: https://jnilo1.github.io/rtl8196e-gateway/
repo_url: https://github.com/jnilo1/rtl8196e-gateway
repo_name: jnilo1/rtl8196e-gateway
edit_uri: edit/main/

# Single source: .md files stay at their current location in the repo.
# The mkdocs-same-dir plugin allows docs_dir to be the repo root.
docs_dir: .
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes        # README.md becomes the section landing page
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - same-dir         # required for docs_dir: .
  - awesome-pages    # auto-nav from directory tree (used more in phase 2+)
  - section-index    # README.md → section index page

extra_css:
  - docs-assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Use a github-compatible slugifier so anchor links written for
      # github.com (e.g. #use-case-1-zoh--zigbee-zigbee-on-host) also
      # resolve on the MkDocs site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# User journeys come first. Component and developer references remain available
# below them without forcing a first-time installer through implementation
# details.
nav:
  - Home: README.md
  - Start here:
    - First installation: docs/getting-started.md
    - Choose a radio mode: docs/radio-options.md
    - Upgrade: docs/upgrading.md
    - Use and maintain the gateway: docs/using-the-gateway.md
    - Troubleshooting: docs/troubleshooting.md
    - Backup and restore: 3-Main-SoC-Realtek-RTL8196E/30-Backup-Restore/README.md
    - Install and upgrade reference: 3-Main-SoC-Realtek-RTL8196E/35-Migration/README.md
  - Hardware:
    - Lidl Silvercrest / Tuya: 0-Hardware/README.md
    - Sengled Smart Hub G4: 0-Hardware/sengled-e39-g8c/README.md
  - Radio firmware (EFR32):
    - 2-Zigbee-Radio-Silabs-EFR32/README.md
    - Per-board builds: 2-Zigbee-Radio-Silabs-EFR32/boards/README.md
    - NCP (Zigbee2MQTT / ZHA): 2-Zigbee-Radio-Silabs-EFR32/24-NCP-UART-HW/README.md
    - RCP (Zigbee 8.2 / Zigbee + Thread):
      - Overview: 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/README.md
      - Docker stacks: 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/docker/README.md
      - Zigbee + Thread (multi-PAN): 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/docker/cpcd-zigbeed-otbr/README.md
      - Without Docker (rcp-stack): 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/rcp-stack/README.md
      - Build cpcd: 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/cpcd/README.md
      - Build zigbeed: 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/zigbeed/README.md
      - "Background: EmberZNet 8.x on Series 1": 2-Zigbee-Radio-Silabs-EFR32/25-RCP-UART-HW/EMBERZNET-8.x-GUIDE.md
    - OT-RCP (Thread / Zigbee-on-Host):
      - Overview: 2-Zigbee-Radio-Silabs-EFR32/26-OT-RCP/README.md
      - Thread and Matter primer: 2-Zigbee-Radio-Silabs-EFR32/26-OT-RCP/THREAD-MATTER-PRIMER.md
      - ot-ctl cheat sheet: 2-Zigbee-Radio-Silabs-EFR32/26-OT-RCP/OT-CTL-CHEATSHEET.md
