      - Commands: 3-Main-SoC-Realtek-RTL8196E/31-Bootloader/doc/COMMANDS.md
      - Reboot to bootloader: 3-Main-SoC-Realtek-RTL8196E/31-Bootloader/doc/REBOOT_TO_BOOTLOADER.md
      - Testing guide: 3-Main-SoC-Realtek-RTL8196E/31-Bootloader/doc/TESTING.md
    - Kernel:
      - Overview: 3-Main-SoC-Realtek-RTL8196E/32-Kernel/README.md
      - UART diagnostics: 3-Main-SoC-Realtek-RTL8196E/32-Kernel/tools/README.md
      - UART↔TCP bridge:
        - Operation: 3-Main-SoC-Realtek-RTL8196E/32-Kernel/files-6.18/drivers/net/rtl8196e-uart-bridge/README.md
        - Security: 3-Main-SoC-Realtek-RTL8196E/32-Kernel/files-6.18/drivers/net/rtl8196e-uart-bridge/SECURITY.md
