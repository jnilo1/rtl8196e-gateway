%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/leds-gpio-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LEDs connected to non-sleeping GPIO lines with software PWM

maintainers:
  - J. Nilo <jnilo@free.fr>

description:
  GPIO LEDs whose intermediate brightness is generated by a jiffies-based
  software PWM timer.  The GPIO controller must be safe for atomic MMIO access.

properties:
  compatible:
    const: gpio-leds-pwm

patternProperties:
  "(^led-[0-9a-f]$|led)":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      gpios:
        maxItems: 1

      retain-state-suspended: false
      retain-state-shutdown: false
      panic-indicator: false

    required:
      - gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    leds {
        compatible = "gpio-leds-pwm";

        status-led {
            label = "status";
            gpios = <&gpio0 11 GPIO_ACTIVE_LOW>;
            default-state = "off";
        };
    };

...
