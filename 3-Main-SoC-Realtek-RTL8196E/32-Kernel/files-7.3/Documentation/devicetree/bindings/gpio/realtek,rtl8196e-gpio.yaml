%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/realtek,rtl8196e-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E GPIO controller

maintainers:
  - Jacques Nilo <jnilo@free.fr>

description: |
  One 32-line bank across four 8-bit ports (A = 0-7, B = 8-15, C = 16-23,
  D = 24-31), driven by the generic MMIO GPIO core: DATA at offset 0x0c and
  DIR at 0x08.

  Pads B2-B6 (offsets 10-14) are shared between this controller and the switch
  core's ASIC LED outputs LED_PORT0-4. Ownership of each shared pad is decided
  by two properties on THIS node, and both the GPIO driver and the Ethernet
  driver read them, so the two never fight over PIN_MUX_SEL_2:

    * a non-empty gpio-line-names entry claims the pad for GPIO;
    * an entry in realtek,led-pads claims it for the ASIC LED function;
    * a pad claimed by neither is left in GPIO/Hi-Z, provided
      realtek,led-pads is present at all.

  If realtek,led-pads is absent entirely, every unnamed pad falls back to the
  ASIC LED function — which is why a board that overrides gpio-line-names must
  review this property in the same change.

  A schema cannot catch an electrically wrong but syntactically valid pad
  number: choosing the pad the board did not wire produces a dead LAN LED that
  reads back perfectly correct. Board bring-up must still include a visual
  LED check.

properties:
  compatible:
    const: realtek,rtl8196e-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-line-names:
    minItems: 32
    maxItems: 32

  realtek,syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      System controller holding PIN_MUX_SEL_2 (0x44), the pad-mux register for
      the shared pads B2-B6. Required: without it offsets 10-14 cannot be
      switched to GPIO mode, so the driver fails to probe rather than leaving
      those lines silently stuck in peripheral mode.

  realtek,led-pads:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 5
    uniqueItems: true
    items:
      minimum: 10
      maximum: 14
    description: |
      GPIO offsets of the shared pads B2-B6 that this board wires to the switch
      core's ASIC LED outputs instead of to GPIO. Only offsets 10-14 are
      muxable; any other value describes a pad that does not exist as a shared
      pad. Lidl/Silvercrest uses <14> (B6, LAN LED); the Sengled E39-G8C uses
      <10> (B2).

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"
  - realtek,syscon

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        gpio-controller@3500 {
            compatible = "realtek,rtl8196e-gpio";
            reg = <0x3500 0x38>;
            gpio-controller;
            #gpio-cells = <2>;
            realtek,syscon = <&sysc>;
            gpio-line-names =
                "", "", "", "", "", "", "", "",
                "", "reset-button", "", "status-led",
                "efr32-nrst", "", "", "",
                "", "", "", "", "", "", "", "",
                "", "", "", "", "", "", "", "";
            realtek,led-pads = <14>;
        };
    };
