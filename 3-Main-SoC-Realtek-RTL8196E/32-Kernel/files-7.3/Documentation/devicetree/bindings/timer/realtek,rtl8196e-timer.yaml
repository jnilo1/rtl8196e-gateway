%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/realtek,rtl8196e-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL8196E timer controller

maintainers:
  - Jacques Nilo <jnilo@free.fr>

description: |
  The RTL8196E timer controller provides two 28-bit counters. Timer0 is
  used as a one-shot clockevent and Timer1 as the free-running clocksource.
  Their clock divider is shared with the adjacent on-chip watchdog, so both
  the reference tick and the bus clock are required to derive an exact
  divider.

properties:
  $nodename:
    pattern: "^timer@[0-9a-f]+$"

  compatible:
    oneOf:
      - items:
          - const: realtek,rtl8196e-timer
          - const: realtek,rtl819x-timer
      - const: realtek,rtl819x-timer
        deprecated: true

  reg:
    maxItems: 1
    description: Timer registers DATA0 through CDBR, excluding WDTCNR.

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Timer0, Timer1 and watchdog reference tick
      - description: SoC bus clock used as the CDBR divider input

  clock-names:
    items:
      - const: refclk
      - const: busclk

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    timer@3100 {
        compatible = "realtek,rtl8196e-timer", "realtek,rtl819x-timer";
        reg = <0x3100 0x1c>;
        interrupts = <7>;
        clocks = <&slowclk>, <&busclk>;
        clock-names = "refclk", "busclk";
    };
...
